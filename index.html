<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>경영대학 소개 메뉴 시안</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
<style>
@font-face{font-family:'S-Core Dream';font-weight:500;font-display:swap;src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_six@1.2/S-CoreDream-5Medium.woff') format('woff')}
@font-face{font-family:'S-Core Dream';font-weight:700;font-display:swap;src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_six@1.2/S-CoreDream-6Bold.woff') format('woff')}

:root{
  color-scheme:light;
  --ku-green:#005128; --green-deep:#033A1E; --green-bright:#18944A;
  --ink:#1A211D; --ink-2:#4F5B55; --ink-3:#7B8680;
  --line:#D8E0DA; --line-strong:#B9C6BE; --band:#E6EFE9;
  --ground:#F4F7F5; --surface:#FFFFFF;
  --display:'S-Core Dream','Pretendard',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --body:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
  --wrap:1140px; --gutter:24px;
  --hero-h:clamp(170px,19vw,240px);
}
*,*::before,*::after{box-sizing:border-box}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
body{margin:0;background:var(--surface);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7;word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{appearance:none;background:none;border:0;font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--green-bright);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--display);margin:0;line-height:1.25;font-weight:700;text-wrap:balance}
p,dl,dt,dd{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
.wrap{max-width:var(--wrap);margin-inline:auto;padding-inline:var(--gutter)}

/* ── 헤더: 로고 + 상단 메뉴 (드롭다운 없음) ── */
.hdr{background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:stretch;justify-content:space-between;gap:32px}
.logo{display:flex;align-items:center;gap:12px;padding:16px 0}
.logo .ku{display:inline-grid;place-items:center;width:44px;height:44px;border:2px solid var(--ku-green);color:var(--ku-green);font-family:var(--display);font-weight:700;font-size:15px;border-radius:3px}
.logo .name{font-family:var(--display);font-weight:700;font-size:20px;line-height:1.1}
.logo .name small{display:block;font-family:var(--body);font-weight:500;font-size:11px;color:var(--ink-3);letter-spacing:.04em;margin-bottom:2px}
.gnb{display:flex;align-items:center;gap:2px;flex-wrap:wrap}
.gnb button{position:relative;font-family:var(--display);font-weight:500;font-size:17px;padding:6px 14px 9px;color:var(--ink)}
.gnb button::after{content:"";position:absolute;left:14px;right:14px;bottom:0;height:3px;background:var(--ku-green);opacity:0;transition:opacity .15s}
.gnb button:hover{color:var(--ku-green)}
.gnb button[aria-current="true"]{color:var(--ku-green);font-weight:700}
.gnb button[aria-current="true"]::after{opacity:1}

/* ── 상단 메뉴 팝업 — 기존 사이트처럼 마우스를 올리면 녹색 패널에 하위 메뉴 ── */
.hdr{position:relative;z-index:20}
.mega{position:absolute;left:0;right:0;top:100%;background:linear-gradient(100deg,#0B4A26 0%,#12703A 55%,#2E8B3E 100%);color:#fff;box-shadow:0 12px 24px rgba(0,0,0,.14)}
.mega[hidden]{display:none}
.mega .wrap{display:grid;grid-template-columns:220px 1fr;gap:32px;padding-block:26px 30px}
.mega .tag{font-size:14px;line-height:1.6;opacity:.85}
.mega .tag b{display:block;font-family:var(--display);font-size:21px;font-weight:700;margin-bottom:6px}
.mega ul{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px 28px;align-content:start}
.mega li button{width:100%;text-align:left;padding:10px 2px 9px;border-bottom:1px solid rgba(255,255,255,.35);font-size:15px;font-weight:500;color:#fff}
.mega li button:hover,.mega li button:focus-visible{border-bottom-color:#fff}
.mega li button[aria-current="true"]{font-weight:700;border-bottom:2px solid #9BD8B2}
.mega .ext::after{content:" ↗";font-size:12px;opacity:.75}
@media (hover:none),(max-width:960px){.mega{display:none!important}}

/* ── 사진 히어로 (경영학과 시안 1번과 같은 방식) ── */
.hero{position:relative;height:var(--hero-h);overflow:hidden;background:var(--green-deep)}
.hero img{width:100%;height:100%;object-fit:cover;object-position:center 30%;display:block}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,22,11,.66) 0%,rgba(0,22,11,.42) 45%,rgba(0,22,11,.28) 100%)}
.hero .wrap{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);z-index:1;display:flex;align-items:center;gap:30px;color:#fff}
.hero h1{font-size:34px;letter-spacing:-.01em;color:#fff}
.hero .tag{font-size:13px;line-height:1.55;opacity:.9;padding-top:6px}
.hero .tag b{display:block;font-family:var(--display);font-weight:500;font-size:14px;letter-spacing:.01em}

/* ── 하위 메뉴 = 페이지 안의 탭 ── */
.page{padding:0 0 88px}
.tabs{display:flex;gap:2px;margin-top:30px;border-bottom:1px solid var(--line-strong);overflow-x:auto;scrollbar-width:none}
.tabs[hidden]{display:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{padding:12px 16px 10px;font-family:var(--display);font-weight:500;font-size:15px;color:var(--ink-2);white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button:hover{color:var(--ku-green)}
.tabs button[aria-current="true"]{color:var(--ku-green);font-weight:700;border-bottom-color:var(--ku-green)}
.tabs .ext::after{content:" ↗";font-size:12px;color:var(--ink-3)}
/* 기존 사이트처럼 하위 메뉴는 상단 팝업으로만 이동 — 페이지 안 탭은 데스크톱에서 없앰 (팝업이 없는 폰·터치 화면에서만 대신 표시) */
@media (hover:hover) and (min-width:961px){.tabs{display:none!important}}
.tabs .was{font-family:var(--body);font-weight:400;font-size:12px;color:var(--ink-3);margin-left:6px}
.content{margin-top:44px;min-height:420px}

/* 자리 표시 */
.ph{min-height:240px;display:grid;place-items:center;text-align:center;border:1px dashed var(--line-strong);border-radius:6px;color:var(--ink-3);font-size:14px;background:repeating-linear-gradient(135deg,transparent 0 14px,rgba(0,81,40,.045) 14px 28px)}
.imgph{display:grid;place-items:center;text-align:center;padding:12px;border:1.5px dashed var(--line-strong);color:var(--ink-3);font-size:12px;line-height:1.5;background:repeating-linear-gradient(45deg,#F3F6F4 0 10px,#EBF0ED 10px 20px)}
.imgph b{display:block;font-weight:700;color:var(--ink-2);font-size:13px}
.todo{color:var(--ink-3);border-bottom:1px dashed var(--line-strong);font-weight:500}
.extcard{border:1px solid var(--line);padding:26px 28px;display:flex;justify-content:space-between;align-items:center;gap:20px}
.extcard b{font-family:var(--display);font-size:16px}
.extcard span{display:block;font-size:14px;color:var(--ink-2);margin-top:4px}
.btn{display:inline-block;background:var(--ku-green);color:#fff;padding:9px 16px;border-radius:3px;font-size:14px;font-weight:600;white-space:nowrap}
.btn.line{background:none;color:var(--ku-green);border:1px solid var(--ku-green)}
.btn.line:hover{background:var(--ku-green);color:#fff}

/* ── 공통 섹션 ── */
.sec{padding-block:56px}
.sec:first-child{padding-top:0}
.sec:last-child{padding-bottom:0}
.sec > h2{font-size:24px;letter-spacing:-.02em;margin-bottom:22px}
.sec > h2 + .lead{margin-top:-10px;margin-bottom:24px;color:var(--ink-2);font-size:15px}
.sec.band{background:var(--band);padding:44px}
.sec.tint{background:var(--ground);padding:44px}
.sec.band + .sec,.sec.tint + .sec{padding-top:56px}

/* ── 1. 인사말 ── */
.greet{display:grid;grid-template-columns:minmax(240px,290px) minmax(0,1fr);gap:48px;align-items:start}
.dean{border:1px solid var(--line);background:var(--surface)}
.dean .imgph{aspect-ratio:3/4;border-width:0 0 1.5px 0}
.dean .body{padding:16px 18px 18px}
.dean .role{font-size:11.5px;color:var(--green-bright);font-weight:700;letter-spacing:.1em}
.dean h3{font-size:19px;margin:2px 0 12px}
.dean h3 small{font-family:var(--body);font-size:13px;font-weight:500;color:var(--ink-2);margin-left:4px}
.dean dl{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:13.5px}
.dean dt{color:var(--ink-3)}
.dean dd{font-variant-numeric:tabular-nums}
.greet .text{max-width:42em;font-size:17px;line-height:1.85}
.greet .text p{margin-bottom:1.15em}
.greet .text .open{font-family:var(--display);font-weight:500;font-size:22px;line-height:1.55;color:var(--ku-green);margin-bottom:.5em}
.greet .text .sub{font-size:15px;color:var(--ink-2);line-height:1.75;padding-bottom:1.2em;margin-bottom:1.4em;border-bottom:1px solid var(--line)}
.sign{margin-top:30px;padding-top:18px;border-top:1px solid var(--line-strong);font-size:14px;color:var(--ink-2)}
.sign b{display:block;font-family:var(--display);font-weight:700;font-size:17px;color:var(--ink);margin-top:2px}

/* ── 2. 교육 인증 ── */
.accr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.accr article{background:var(--surface);border:1px solid var(--line);padding:26px 28px 24px;display:grid;gap:16px;align-content:start}
.accr header{display:grid;grid-template-columns:1fr auto;gap:4px 16px;align-items:start}
.accr h3{font-size:21px;color:var(--ku-green);letter-spacing:-.01em}
.accr .en{font-size:12.5px;color:var(--ink-3);line-height:1.45;grid-column:1}
.accr .since{grid-column:2;grid-row:1 / span 2;text-align:right;font-size:12px;color:var(--ink-3);line-height:1.5;white-space:nowrap}
.accr .since b{display:block;font-family:var(--display);font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums}
.accr .desc{display:grid;gap:10px;border-top:1px solid var(--line);padding-top:16px}
.accr .desc p{font-size:15px;line-height:1.75}
.accr .go{justify-self:start;margin-top:2px}

/* ── 3. 이념 · 연혁 ── */
.idea{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:48px;align-items:start}
.idea .about p{font-size:16px;line-height:1.85}
.idea .about p + p{margin-top:.8em}
.idea h3{font-size:15px;color:var(--ink-2);font-family:var(--body);font-weight:600;margin-bottom:10px}
.goals{border-top:1px solid var(--ink)}
.goals li{display:grid;grid-template-columns:200px 1fr;gap:4px 20px;align-items:baseline;padding:12px 0;border-bottom:1px solid var(--line-strong)}
.goals b{font-family:var(--display);font-weight:700;font-size:16px;color:var(--ku-green)}
.goals span{font-size:15px;color:var(--ink-2);line-height:1.65}
.sec > h2.next{margin-top:52px}
.focus{margin-top:0}
.focus ul{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 28px}
.focus li{position:relative;padding-left:14px;font-size:15px;line-height:1.65}
.focus li::before{content:"";position:absolute;left:0;top:.72em;width:5px;height:5px;border-radius:50%;background:var(--green-bright)}
.hist{border-top:1px solid var(--ink)}
.hist li{display:grid;grid-template-columns:118px 1fr;gap:20px;padding:11px 0;border-bottom:1px solid var(--line);font-size:15px;line-height:1.65}
.hist time{font-family:var(--display);font-weight:700;color:var(--ku-green);font-variant-numeric:tabular-nums;font-size:14.5px}
details.more{border-bottom:1px solid var(--line)}
details.more > summary{cursor:pointer;list-style:none;padding:13px 0;font-size:14px;font-weight:600;color:var(--ku-green);display:flex;align-items:center;gap:8px}
details.more > summary::-webkit-details-marker{display:none}
details.more > summary::before{content:"+";font-family:var(--display);font-size:16px;line-height:1;width:14px}
details.more[open] > summary::before{content:"–"}
details.more .hist{border-top:1px solid var(--line)}
details.more .hist li:last-child{border-bottom:0}

/* ── 4. 찾아오시는 길 ── */
.loc{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:52px;align-items:start}
.addr{border-top:1px solid var(--ink);padding-top:20px;margin-bottom:26px}
.addr dl{display:grid;grid-template-columns:auto 1fr;gap:10px 22px;font-size:16px}
.addr dt{color:var(--ink-3);font-size:13px;padding-top:5px;white-space:nowrap}
.addr dd{font-weight:500;line-height:1.6;font-variant-numeric:tabular-nums}
.map{aspect-ratio:4/3}
.way{display:grid;grid-template-columns:44px 1fr;gap:16px;padding:20px 0;border-top:1px solid var(--line)}
.way:last-child{border-bottom:1px solid var(--line)}
.way .ico{width:44px;height:44px;border:1px solid var(--line-strong);display:grid;place-items:center;color:var(--ku-green);background:var(--surface)}
.way h3{font-size:16px;margin-bottom:8px}
.way li{font-size:15px;display:grid;grid-template-columns:minmax(0,auto) 1fr;gap:12px;padding:3px 0;line-height:1.6}
.way li b{font-weight:600;color:var(--ink-2)}
.way li span{font-variant-numeric:tabular-nums}

/* ── 행정실: 학과장 소개 카드와 같은 방식 (작은 사진 + 직책·이름·연락처·담당 업무) ── */
.staff{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.person{display:grid;grid-template-columns:108px 1fr;background:var(--surface);border:1px solid var(--line)}
.person .imgph{border-width:0 1.5px 0 0;padding:8px;font-size:11px;min-height:150px}
.person .imgph b{font-size:12px}
.person .body{padding:12px 14px 14px}
.person .role{font-size:11.5px;color:var(--green-bright);font-weight:700;letter-spacing:.1em}
.person h3{font-size:18px;margin:2px 0 10px}
.person dl{display:grid;gap:5px;font-size:13px;line-height:1.45}
.person dt{color:var(--ink-3);font-size:11px;letter-spacing:.06em}
.person dd{overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.person .duty{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:13px;color:var(--ku-green);font-weight:600;line-height:1.5;display:grid;grid-template-columns:auto 1fr;gap:6px}
.person .duty::before{content:"담당";font-size:10.5px;letter-spacing:.08em;color:var(--ink-3);font-weight:700;padding-top:3px}
.contact{margin-top:32px;border-top:1px solid var(--ink);display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.contact div{padding:16px 0;border-bottom:1px solid var(--line)}
.contact dt{font-size:12px;color:var(--ink-3);letter-spacing:.04em}
.contact dd{font-size:15px;font-weight:500;font-variant-numeric:tabular-nums}

/* ── 윤리강령 ── */
.charter{max-width:46em;font-size:17px;line-height:1.85}
.charter p + p{margin-top:1em}
.charter p:first-child{font-family:var(--display);font-weight:500;font-size:19px;line-height:1.7;color:var(--ku-green)}
.code{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;align-items:start}
.code article{border:1px solid var(--line);padding:26px 28px 14px}
.code h3{font-size:20px;color:var(--ku-green);margin-bottom:4px}
.code h4{font-family:var(--body);font-size:12px;font-weight:700;color:var(--green-bright);letter-spacing:.06em;margin:18px 0 8px}
.code ol.rule{counter-reset:r;display:grid;gap:10px}
.code ol.rule li{counter-increment:r;position:relative;padding-left:26px;font-size:15px;line-height:1.7}
.code ol.rule li::before{content:counter(r);position:absolute;left:0;top:.18em;width:18px;height:18px;border-radius:50%;background:var(--band);color:var(--ku-green);font-size:11px;font-weight:700;display:grid;place-items:center;font-family:var(--display)}
.code details{border-top:1px solid var(--line)}
.code details > summary{cursor:pointer;list-style:none;padding:12px 0;font-size:15px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.code details > summary::-webkit-details-marker{display:none}
.code details > summary::after{content:"+";font-family:var(--display);color:var(--ink-3);font-size:17px;line-height:1}
.code details[open] > summary::after{content:"–"}
.code details ol{padding:0 0 14px;display:grid;gap:6px}
.code details li{display:grid;grid-template-columns:30px 1fr;font-size:14.5px;line-height:1.7;color:var(--ink-2)}
.code details li i{font-style:normal;color:var(--ink-3);font-variant-numeric:tabular-nums;font-size:13px;padding-top:1px}

/* ── 대학(학부) › 학과소개: 학과 소개 + 홈페이지 바로가기 (학과장 정보는 각 학과 홈페이지에) ── */
.depts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.depts article{border:1px solid var(--line);padding:28px 30px 26px;display:grid;grid-template-rows:auto 1fr auto;gap:14px}
.depts h3{font-size:22px;color:var(--ku-green);letter-spacing:-.01em}
.depts h3 small{font-family:var(--body);font-size:14px;font-weight:600;color:var(--ink-3);margin-left:6px}
.depts p{font-size:15.5px;line-height:1.8}
.depts .btn{justify-self:start}
@media (max-width:640px){.depts{grid-template-columns:1fr}}

/* 시안 안내 */
.memo{margin-top:64px;padding:18px 20px;border:1px dashed var(--line-strong);font-size:13px;line-height:1.7;color:var(--ink-2);background:var(--ground)}
.memo b{color:var(--ink)}

@media (max-width:960px){
  .bar{flex-wrap:wrap;gap:0}
  .gnb{padding-bottom:8px}
  .gnb button{padding:8px 11px;font-size:16px}
  .hero h1{font-size:26px}
  .hero .tag{display:none}
  .idea,.loc,.code{grid-template-columns:1fr;gap:32px}
  .code{gap:16px}
  .accr article{padding:22px 22px 20px}
  .accr header{grid-template-columns:1fr}
  .accr .since{grid-column:1;grid-row:auto;text-align:left}
  .staff{grid-template-columns:repeat(2,minmax(0,1fr))}
  .contact{grid-template-columns:1fr}
  .sec.band,.sec.tint{padding:30px 22px}
}
@media (max-width:640px){
  .accr{grid-template-columns:1fr}
  .staff{grid-template-columns:1fr}
  .greet{grid-template-columns:1fr;gap:28px}
  .dean{display:grid;grid-template-columns:120px 1fr}
  .dean .imgph{border-width:0 1.5px 0 0}
  .goals li,.hist li{grid-template-columns:1fr;gap:0}
  .focus ul{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header class="hdr">
  <div class="wrap">
    <div class="bar">
      <a class="logo" href="#" id="logo"><span class="ku">KU</span><span class="name"><small>KONKUK UNIVERSITY</small>경영대학</span></a>
      <nav class="gnb" id="gnb" aria-label="주 메뉴"></nav>
    </div>
  </div>
  <div class="mega" id="mega" hidden>
    <div class="wrap">
      <p class="tag"><b id="megaTitle"></b>건국, 세계를 이끌<br>녹색의 물결</p>
      <ul id="megaList"></ul>
    </div>
  </div>
</header>

<div class="stage">
  <div class="hero">
    <img data-img="hero" alt="">
    <div class="wrap">
      <h1 id="heroTitle"></h1>
      <p class="tag"><b>A history of leadership Konkuk University</b>건국, 세계를 이끌 녹색의 물결</p>
    </div>
  </div>

  <main class="page">
    <div class="wrap">
      <nav class="tabs" id="tabs" aria-label="하위 메뉴"></nav>
      <div class="content" id="content"></div>
    </div>
  </main>
</div>

      <p>1956년 정치대학 상학과로 첫발을 내디딘 건국대학교 경영대학은 지난 70여 년간 성(誠)·신(信)·의(義)의 건학 이념을 바탕으로 시대를 이끄는 수많은 리더를 배출해 왔습니다. 급변하는 지금의 비즈니스 환경에서도 전통의 저력은 더욱 빛을 발하고 있습니다. 우리 대학은 경영학과의 7대 세부 전공과 국내 최초로 설립된 기술경영학과의 유기적인 시너지를 통해, 기술과 경영을 아우르는 독보적인 융합 교육 모델을 제시하고 있습니다. 더불어 세계적 수준의 교육 품질을 증명하는 AACSB 국제인증을 바탕으로, 우리 학생들을 세계 무대에서 활약할 글로벌 인재로 키워내고 있습니다.</p>

const MENU = [
  { name:'경영대학소개', tabs:[
      { name:'경영대학 소개', view:{kind:'tpl', id:'tpl-about'} },    // 인사말 + 교육 인증 + 이념·연혁 + 찾아오시는 길
      { name:'행정실',       view:{kind:'tpl', id:'tpl-office'} },   // 이름·사진 포함
      { name:'윤리강령',     view:{kind:'tpl', id:'tpl-ethics'} } ] },
  { name:'대학(학부)', tabs:[ { name:'학과소개', view:{kind:'tpl', id:'tpl-depts'} }, blank('입학안내') ] },   // 졸업요건·장학제도 탭 제거
  { name:'대학원',     tabs:[ blank('경영학'), blank('기술경영학') ] },
  { name:'교수소개',   tabs:[ ext('경영학과','경영학과 홈페이지 교수소개'), ext('기술경영학과','기술경영학과 홈페이지 교수소개') ] },
  { name:'커뮤니티',   tabs:[ blank('공지사항'), blank('FAQ'), blank('자료실'), blank('포토갤러리') ] },
  { name:'학생활동',   tabs:[ blank('경영대학 학생회'), ext('경영학과 학생회','경영학과 홈페이지'), ext('기술경영학과 학생회','기술경영학과 홈페이지') ] },
  { name:'취업지원',   tabs:[], view:{kind:'blank'} },
  { name:'이용안내',   tabs:[ blank('사이트맵'), blank('로그인') ] }
];

const state = { m:0, t:0 };

const VIEW = {
  blank: v  => `<div class="ph">${v.name} — 본문 영역 (내용은 생략)</div>`,
  tpl:   v  => document.getElementById(v.id).innerHTML,
  ext:   v  => `<div class="extcard"><div><b>${v.name}</b><span>외부 페이지(${v.ext})로 연결됩니다. 새 창으로 열림.</span></div><span class="btn">${v.name} 바로가기 ↗</span></div>`
};

function btn(label, cls, on, current){
  const b = document.createElement('button');
  b.type = 'button'; b.textContent = label;
  if (cls) b.className = cls;
  if (current) b.setAttribute('aria-current','true');
  b.addEventListener('click', on);
  return b;
}

function render(){
  const menu = MENU[state.m];
  const tab  = menu.tabs[state.t];

  const gnb = document.getElementById('gnb'); gnb.replaceChildren();
  MENU.forEach((m,i) => {
    const b = btn(m.name, '', () => { state.m=i; state.t=0; mega.hidden = true; render(); }, i===state.m);
    b.addEventListener('mouseenter', () => openMega(i));
    b.addEventListener('focus', () => openMega(i));
    gnb.append(b);
  });

  const tabs = document.getElementById('tabs');
  tabs.hidden = menu.tabs.length === 0; tabs.replaceChildren();
  menu.tabs.forEach((t,i) => tabs.append(btn(t.name, t.ext ? 'ext' : '', () => { state.t=i; render(); }, i===state.t)));

  document.getElementById('heroTitle').textContent = menu.name;
  const view = tab ? (tab.ext ? {kind:'ext', name:tab.name, ext:tab.ext} : tab.view) : menu.view;
  document.getElementById('content').innerHTML = VIEW[view.kind]({ ...view, name: view.name || (tab ? tab.name : menu.name) });
}

/* 상단 메뉴 팝업 */
const hdr = document.querySelector('.hdr'), mega = document.getElementById('mega');
function openMega(i){
  const m = MENU[i];
  if (!m.tabs.length) { mega.hidden = true; return; }
  document.getElementById('megaTitle').textContent = m.name;
  const ul = document.getElementById('megaList'); ul.replaceChildren();
  m.tabs.forEach((t,j) => {
    const li = document.createElement('li');
    li.append(btn(t.name, t.ext ? 'ext' : '', () => { state.m=i; state.t=j; mega.hidden = true; render(); scrollTo(0,0); }, i===state.m && j===state.t));
    ul.append(li);
  });
  mega.hidden = false;
}
hdr.addEventListener('mouseleave', () => { mega.hidden = true; });
document.getElementById('logo').addEventListener('mouseenter', () => { mega.hidden = true; });
addEventListener('keydown', e => { if (e.key === 'Escape') mega.hidden = true; });

document.getElementById('logo').addEventListener('click', e => { e.preventDefault(); state.m = 0; state.t = 0; render(); scrollTo(0, 0); });
render();
</script>
</body>
</html>
